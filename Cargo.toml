# The umbrella. Nine repositories, checked out side by side, built as one.
#
# `[patch]` below points every `xpui*` git dependency at the sibling checkout
# on disk, so a cross-cutting change is one build and one test run before
# anything is pushed. **It needs the ten checked out as siblings, and that is
# its only demand**: the paths are relative, so they resolve on any machine
# with the layout the README describes. What does not travel is `Cargo.lock`,
# resolved against those paths on the machine that last ran the gate.
[workspace]
resolver = "3"
# `xtask` is the cross-repository gate; `gate` is the crate that names the
# nine as dependencies so one build reaches all of them.
members = ["gate", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-dev"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
too_long_first_doc_paragraph = "deny"

[workspace.lints.rustdoc]
unescaped_backticks = "deny"

# **Every path here is relative, and that is load-bearing.** Relative paths
# resolve on any machine with the ten checked out side by side; an absolute one
# would make this repository meaningless anywhere but the machine that wrote
# it, and would need a check forbidding it a remote.
#
# One entry per repository, keyed by the exact URL the manifests name — Cargo
# matches these by string, and a patch that does not apply is silent.
# `docs/working-across-repositories.md` says what that looks like and how to
# check for it.
[patch.'https://github.com/XPUI-Framework/xpui-framework']
xpui = { path = "../xpui" }

[patch.'https://github.com/XPUI-Framework/xpui-chrome']
xpui-chrome = { path = "../xpui-chrome" }

[patch.'https://github.com/XPUI-Framework/xpui-boards']
xpui-boards-core = { path = "../xpui-boards/core" }
xpui-boards-pimoroni = { path = "../xpui-boards/pimoroni" }
xpui-boards-seeed = { path = "../xpui-boards/seeed" }
xpui-boards-xteink = { path = "../xpui-boards/xteink" }

[patch.'https://github.com/XPUI-Framework/xpui-backends']
xpui-abi-check = { path = "../xpui-backends/abi-check" }
xpui-embedded-graphics = { path = "../xpui-backends/embedded_graphics" }
xpui-fui = { path = "../xpui-backends/fui" }
xpui-screenshot = { path = "../xpui-backends/screenshot" }

[patch.'https://github.com/XPUI-Framework/xpui-simulator']
xpui-simulator = { path = "../xpui-simulator" }

[patch.'https://github.com/XPUI-Framework/xpui-gallery']
xpui-gallery = { path = "../xpui-gallery/gallery" }

# What a `cargo build --release` of this repository alone produces — not what
# ships. A library's profile applies only at the top of a build; a firmware's
# workspace sets the profile for everything it links; `xpui-rp2040`,
# `xpui-esp32` and `xpui-cpp` use `opt-level = "z"`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
