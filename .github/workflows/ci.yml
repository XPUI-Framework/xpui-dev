name: CI

# Every push to `main`, and every pull request.
on:
  push:
    branches: [main]
  pull_request:
  # By hand, so a changed runner can be checked without a
  # fake commit.
  workflow_dispatch:

# Read the checkouts and nothing else; the gate writes nowhere.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross:
    name: The stack, as one workspace
    runs-on: ubuntu-latest

    env:
      SDL_VIDEODRIVER: dummy

    steps:
      # This repository is the umbrella: its `[patch]` table points at the
      # other nine by relative path, so they have to be checked out beside it
      # rather than under it. Everything lands in `stack/`, which is the layout
      # the README tells a person to create by hand.
      #
      # `xpui-framework` is checked out as `xpui`, matching the crate — the
      # repository is named for the project and the directory for the crate.
      - uses: actions/checkout@v7
        with: { path: stack/xpui-dev }
      - uses: actions/checkout@v7
        with: { repository: XPUI-Framework/xpui-framework, path: stack/xpui }
      - uses: actions/checkout@v7
        with: { repository: XPUI-Framework/xpui-chrome,    path: stack/xpui-chrome }
      - uses: actions/checkout@v7
        with: { repository: XPUI-Framework/xpui-boards,    path: stack/xpui-boards }
      - uses: actions/checkout@v7
        with: { repository: XPUI-Framework/xpui-backends,  path: stack/xpui-backends }
      - uses: actions/checkout@v7
        with: { repository: XPUI-Framework/xpui-simulator, path: stack/xpui-simulator }
      - uses: actions/checkout@v7
        with: { repository: XPUI-Framework/xpui-gallery,   path: stack/xpui-gallery }
      - uses: actions/checkout@v7
        with: { repository: XPUI-Framework/xpui-rp2040,    path: stack/xpui-rp2040 }
      - uses: actions/checkout@v7
        with: { repository: XPUI-Framework/xpui-esp32,     path: stack/xpui-esp32 }
      - uses: actions/checkout@v7
        with: { repository: XPUI-Framework/xpui-cpp,       path: stack/xpui-cpp }

      # `every_patched_crate_builds` compiles the simulator, which links SDL2.
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      # `rust-toolchain.toml` pins the channel and the components, and lists
      # no target: `cross` builds for the host only, and the sibling gates
      # that need a bare-metal triple run in their own workflows.
      - name: Install Rust
        run: |
          cd stack/xpui-dev
          rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            stack/xpui-dev/target
          key: dev-${{ runner.os }}-${{ hashFiles('stack/xpui-dev/Cargo.lock') }}
          restore-keys: dev-${{ runner.os }}-

      # `cross`, not the default. Each of the nine runs its own gate in its own
      # workflow, so running all nine again here would pay twice for the same
      # checks. What is left is
      # the things no single repository can see: that every sibling is here,
      # that the copies of the shared files are still one file each, that both
      # SDK pins agree, that every organisation URL resolves, that the lock
      # files agree about the crates whose types cross a boundary — and that
      # every patched crate still builds from local paths.
      - name: The cross-repository gate
        run: cd stack/xpui-dev && ./build-and-test.sh cross
